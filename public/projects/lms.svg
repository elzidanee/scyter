  <circle cx="280" cy="220" r="28" fill="#FFD700" fill-opacity="0.9" />
  <polygon points="274,208 274,232 292,220" fill="#0D0D0D" />
  <!-- Progress bar -->
  <rect x="95" y="315" width="370" height="4" rx="2" fill="#222222" />
  <rect x="95" y="315" width="220" height="4" rx="2" fill="#FFD700" />
  <text x="75" y="360" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Modul 04: Pengantar Rekayasa Sistem Kustom</text>
  <text x="75" y="380" fill="#888888" font-family="sans-serif" font-size="11">Progress Kursus: 65% Selesai · Instruktur: ScyterCorp Academy</text>

  <!-- Right Side: Syllabus / Curriculum List -->
  <rect x="505" y="105" width="220" height="280" rx="10" fill="#1A1A1A" stroke="#282828" />
  <text x="525" y="132" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Daftar Modul Belajar</text>

  <!-- Item 1 -->
  <rect x="520" y="150" width="190" height="40" rx="6" fill="#222222" />
  <circle cx="538" cy="170" r="8" fill="#2ECC71" />
  <text x="555" y="174" fill="#CCCCCC" font-family="sans-serif" font-size="10">01. Setup &amp; Fundamental</text>

  <!-- Item 2 -->
  <rect x="520" y="198" width="190" height="40" rx="6" fill="#222222" />
  <circle cx="538" cy="218" r="8" fill="#2ECC71" />
  <text x="555" y="222" fill="#CCCCCC" font-family="sans-serif" font-size="10">02. Arsitektur Database</text>

  <!-- Item 3 Active -->
  <rect x="520" y="246" width="190" height="40" rx="6" fill="#FFD700" fill-opacity="0.15" stroke="#FFD700" stroke-width="1" />
  <circle cx="538" cy="266" r="8" fill="#FFD700" />
  <text x="555" y="270" fill="#FFD700" font-family="sans-serif" font-size="10" font-weight="bold">03. Pemrograman Inti (Aktif)</text>

  <!-- Item 4 -->
  <rect x="520" y="294" width="190" height="40" rx="6" fill="#1C1C1C" />
  <circle cx="538" cy="314" r="8" fill="#444444" />
  <text x="555" y="318" fill="#777777" font-family="sans-serif" font-size="10">04. Kuis &amp; Sertifikat</text>

  <!-- Certificate Ready Badge -->
  <rect x="520" y="345" width="190" height="28" rx="6" fill="url(#goldGrad3)" />
  <text x="615" y="363" fill="#0D0D0D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🎓 E-Sertifikat QR Code</text>
