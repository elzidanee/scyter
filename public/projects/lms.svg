<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="50%" stop-color="#FFE873" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />
  <circle cx="650" cy="120" r="170" fill="#FFD700" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Frame -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#161616" stroke="#2E2E2E" stroke-width="1.5" />

