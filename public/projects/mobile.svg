<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="50%" stop-color="#FFE873" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" />
  <circle cx="400" cy="225" r="160" fill="#FFD700" fill-opacity="0.08" filter="blur(60px)" />

  <!-- Two Smartphone Mockups side by side -->
  <!-- Left Phone (Main Booking Screen) -->
  <rect x="230" y="30" width="170" height="390" rx="28" fill="#181818" stroke="#333333" stroke-width="3" />
  <!-- Phone Notch -->
  <rect x="275" y="38" width="80" height="14" rx="7" fill="#0D0D0D" />
  <circle cx="340" cy="45" r="3" fill="#2ECC71" />

  <!-- Phone Screen Content -->
  <rect x="240" y="60" width="150" height="340" rx="18" fill="#0F0F0F" />

  <!-- App Header -->
  <text x="252" y="85" fill="#888888" font-family="sans-serif" font-size="9">Halo, Budi Santoso</text>
  <text x="252" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Mau Reservasi Kapan?</text>

  <!-- Calendar Strip -->
  <rect x="252" y="115" width="28" height="36" rx="6" fill="#1C1C1C" />
  <text x="266" y="130" fill="#777777" font-family="sans-serif" font-size="8" text-anchor="middle">Sen</text>
  <text x="266" y="144" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">24</text>

  <rect x="286" y="115" width="28" height="36" rx="6" fill="#FFD700" />
  <text x="300" y="130" fill="#0D0D0D" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Sel</text>
  <text x="300" y="144" fill="#0D0D0D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">25</text>

  <rect x="320" y="115" width="28" height="36" rx="6" fill="#1C1C1C" />
  <text x="334" y="130" fill="#777777" font-family="sans-serif" font-size="8" text-anchor="middle">Rab</text>
  <text x="334" y="144" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">26</text>

  <!-- Service Card 1 -->
  <rect x="252" y="165" width="126" height="52" rx="8" fill="#1C1C1C" stroke="#2C2C2C" />
  <circle cx="272" cy="191" r="12" fill="#FFD700" fill-opacity="0.2" />
  <text x="292" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Paket Lengkap</text>
  <text x="292" y="198" fill="#FFD700" font-family="sans-serif" font-size="9">Rp 150.000 · 60 mnt</text>

  <!-- Service Card 2 -->
  <rect x="252" y="225" width="126" height="52" rx="8" fill="#1C1C1C" stroke="#2C2C2C" />
  <circle cx="272" cy="251" r="12" fill="#3B82F6" fill-opacity="0.2" />
  <text x="292" y="245" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Paket Relaksasi</text>
  <text x="292" y="258" fill="#FFD700" font-family="sans-serif" font-size="9">Rp 200.000 · 90 mnt</text>

  <!-- Booking CTA -->
  <rect x="252" y="340" width="126" height="32" rx="8" fill="url(#goldGrad4)" />
  <text x="315" y="360" fill="#0D0D0D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Konfirmasi Reservasi</text>

  <!-- Right Phone (Confirmation / Notification Screen) -->
  <rect x="420" y="55" width="150" height="340" rx="24" fill="#161616" stroke="#2E2E2E" stroke-width="2.5" />
  <rect x="430" y="75" width="130" height="300" rx="14" fill="#0D0D0D" />

  <circle cx="495" cy="130" r="26" fill="#2ECC71" fill-opacity="0.2" />
  <circle cx="495" cy="130" r="16" fill="#2ECC71" />
  <!-- Checkmark icon -->
  <path d="M 488 130 L 493 135 L 503 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <text x="495" y="175" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reservasi Berhasil!</text>
  <text x="495" y="195" fill="#888888" font-family="sans-serif" font-size="8" text-anchor="middle">Selasa, 25 Sep · 14:00 WIB</text>

  <rect x="445" y="215" width="100" height="40" rx="6" fill="#1C1C1C" />
  <text x="495" y="232" fill="#777777" font-family="sans-serif" font-size="8" text-anchor="middle">Notifikasi WhatsApp</text>
  <text x="495" y="246" fill="#2ECC71" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Terkirim ke Pelanggan</text>

  <rect x="445" y="270" width="100" height="28" rx="6" fill="#282828" />
  <text x="495" y="288" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">Lihat E-Tiket</text>
</svg>
